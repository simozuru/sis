<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SIS 管理画面</title>
  <link rel="stylesheet" href="./admin-style.css?v=1.2.0">
</head>
<body>

<div id="gas-config-bridge" style="display: none;"></div>

<!-- ==========================================
     ログイン画面
     ========================================== -->
<div id="login-container" class="login-container">
  <div class="login-box">
    <h1 class="login-title">SIS 管理画面</h1>
    <p class="login-subtitle">スタッフ専用ページです</p>

    <form id="login-form">
      <div class="form-group">
        <label for="admin-password">合言葉</label>
        <input type="password" id="admin-password" required placeholder="合言葉を入力してください">
      </div>
      <div id="login-error" class="login-error" style="display: none;"></div>
      <button type="submit" id="login-btn" class="btn-login">ログイン</button>
    </form>
  </div>
</div>

<!-- ==========================================
     管理画面本体（ログイン後に表示）
     ========================================== -->
<div id="dashboard-container" class="dashboard-container" style="display: none;">
  <header class="dashboard-header">
    <h1 class="dashboard-title">SIS 管理画面</h1>
    <button type="button" id="logout-btn" class="btn-logout">ログアウト</button>
  </header>

  <main class="dashboard-main">
    <section class="report-section">
      <h2 class="section-title">レポート</h2>

      <div class="report-controls">
        <div class="report-control-group">
          <label for="report-type-select">表示する集計</label>
          <select id="report-type-select">
            <option value="designation">指名率</option>
            <option value="menuCount">メニュー実績</option>
            <option value="menuRate">メニュー率</option>
          </select>
        </div>
        <div class="report-control-group">
          <label for="report-start-date">開始日</label>
          <input type="date" id="report-start-date">
        </div>
        <div class="report-control-group">
          <label for="report-end-date">終了日</label>
          <input type="date" id="report-end-date">
        </div>
        <div class="report-quick-buttons">
          <button type="button" class="btn-quick-range" data-range="thisWeek">今週</button>
          <button type="button" class="btn-quick-range" data-range="thisMonth">今月</button>
          <button type="button" class="btn-quick-range" data-range="lastMonth">先月</button>
        </div>
        <button type="button" id="run-report-btn" class="btn-run-report">集計する</button>
      </div>

      <div id="report-error" class="report-error" style="display: none;"></div>

      <div id="report-results" style="display: none;">
        <div id="designation-report-card" class="report-card">
          <h3 class="report-card-title">指名率</h3>
          <div id="designation-summary" class="designation-summary"></div>
          <div id="designation-by-staff" class="designation-by-staff"></div>
        </div>

        <div id="menu-count-report-card" class="report-card">
          <h3 class="report-card-title">メニュー実績</h3>
          <table class="report-table">
            <thead><tr><th>メニュー</th><th>件数</th></tr></thead>
            <tbody id="menu-performance-tbody"></tbody>
          </table>
        </div>

        <div id="menu-rate-report-card" class="report-card">
          <h3 class="report-card-title">メニュー率</h3>
          <table class="report-table">
            <thead><tr><th>メニュー</th><th>割合</th></tr></thead>
            <tbody id="menu-rate-tbody"></tbody>
          </table>
        </div>
      </div>
    </section>
  </main>
</div>

<script src="./js/config.js?v=1.2.0"></script>
<script src="./js/admin.js?v=1.2.0"></script>

</body>
</html>
