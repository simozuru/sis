<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SIS 管理画面</title>
  <link rel="stylesheet" href="./admin-style.css?v=1.3.0">
</head>
<body>

<div id="gas-config-bridge" style="display: none;"></div>

<!-- ==========================================
     ログイン画面
     ========================================== -->
<div id="login-container" class="login-container">
  <div class="login-box">
    <h1 class="login-title">SIS 管理画面</h1>
    <p class="login-subtitle">スタッフ専用ページです</p>

    <form id="login-form">
      <div class="form-group">
        <label for="admin-password">合言葉</label>
        <input type="password" id="admin-password" required placeholder="合言葉を入力してください">
      </div>
      <div id="login-error" class="login-error" style="display: none;"></div>
      <button type="submit" id="login-btn" class="btn-login">ログイン</button>
    </form>
  </div>
</div>

<!-- ==========================================
     管理画面本体（ログイン後に表示）
     ========================================== -->
<div id="dashboard-container" class="dashboard-container" style="display: none;">
  <header class="dashboard-header">
    <h1 class="dashboard-title">SIS 管理画面</h1>
    <nav class="dashboard-tabs">
      <button type="button" class="tab-btn active" data-tab="report">レポート</button>
      <button type="button" class="tab-btn" data-tab="settings1">基本設定</button>
    </nav>
    <button type="button" id="logout-btn" class="btn-logout">ログアウト</button>
  </header>

  <main class="dashboard-main">

    <!-- ==========================================
         タブ①：レポート
         ========================================== -->
    <section id="tab-report" class="tab-page report-section">
      <h2 class="section-title">レポート</h2>

      <div class="report-controls">
        <div class="report-control-group">
          <label for="report-type-select">表示する集計</label>
          <select id="report-type-select">
            <option value="designation">指名率</option>
            <option value="menuCount">メニュー実績</option>
            <option value="menuRate">メニュー率</option>
            <option value="timeSlot">曜日・時間帯の傾向</option>
            <option value="newRepeat">新規・リピート比率</option>
            <option value="frequency">来店頻度の分布</option>
            <option value="dormant">休眠顧客リスト</option>
          </select>
        </div>

        <!-- 「休眠顧客リスト」以外は、この期間指定を使う -->
        <div id="date-range-controls" class="date-range-controls">
          <div class="report-control-group">
            <label for="report-start-date">開始日</label>
            <input type="date" id="report-start-date">
          </div>
          <div class="report-control-group">
            <label for="report-end-date">終了日</label>
            <input type="date" id="report-end-date">
          </div>
          <div class="report-quick-buttons">
            <button type="button" class="btn-quick-range" data-range="thisWeek">今週</button>
            <button type="button" class="btn-quick-range" data-range="thisMonth">今月</button>
            <button type="button" class="btn-quick-range" data-range="lastMonth">先月</button>
          </div>
        </div>

        <!-- 「休眠顧客リスト」だけ、この月数指定を使う -->
        <div id="dormant-controls" class="dormant-controls" style="display: none;">
          <div class="report-control-group">
            <label for="dormant-months-input">最終来店から何ヶ月以上</label>
            <input type="number" id="dormant-months-input" min="1" value="3">
          </div>
        </div>

        <button type="button" id="run-report-btn" class="btn-run-report">集計する</button>
      </div>

      <div id="report-error" class="report-error" style="display: none;"></div>

      <div id="report-results" style="display: none;">
        <div id="designation-report-card" class="report-card">
          <h3 class="report-card-title">指名率</h3>
          <div id="designation-summary" class="designation-summary"></div>
          <div id="designation-by-staff" class="designation-by-staff"></div>
        </div>

        <div id="menu-count-report-card" class="report-card">
          <h3 class="report-card-title">メニュー実績</h3>
          <table class="report-table">
            <thead><tr><th>メニュー</th><th>件数</th></tr></thead>
            <tbody id="menu-performance-tbody"></tbody>
          </table>
        </div>

        <div id="menu-rate-report-card" class="report-card">
          <h3 class="report-card-title">メニュー率</h3>
          <table class="report-table">
            <thead><tr><th>メニュー</th><th>割合</th></tr></thead>
            <tbody id="menu-rate-tbody"></tbody>
          </table>
        </div>

        <div id="time-slot-report-card" class="report-card">
          <h3 class="report-card-title">曜日・時間帯の傾向</h3>
          <div id="time-slot-table-wrap" class="time-slot-table-wrap"></div>
        </div>

        <div id="new-repeat-report-card" class="report-card">
          <h3 class="report-card-title">新規・リピート比率</h3>
          <div id="new-repeat-summary" class="designation-summary"></div>
        </div>

        <div id="frequency-report-card" class="report-card">
          <h3 class="report-card-title">来店頻度の分布</h3>
          <div id="frequency-summary" class="designation-summary"></div>
        </div>

        <div id="dormant-report-card" class="report-card">
          <h3 class="report-card-title">休眠顧客リスト</h3>
          <p id="dormant-count-label" class="dormant-count-label"></p>
          <table class="report-table">
            <thead><tr><th>お客様名</th><th>電話番号</th><th>最終来店日</th><th>来店回数</th></tr></thead>
            <tbody id="dormant-tbody"></tbody>
          </table>
        </div>
      </div>
    </section>

    <!-- ==========================================
         タブ②：基本設定
         ========================================== -->
    <section id="tab-settings1" class="tab-page" style="display: none;">
      <h2 class="section-title">基本設定</h2>

      <div id="settings1-loading" class="settings-loading">読み込み中...</div>
      <div id="settings1-error" class="report-error" style="display: none;"></div>
      <div id="settings1-saved-msg" class="settings-saved-msg" style="display: none;">保存しました。</div>

      <form id="settings1-form" style="display: none;">

        <div class="settings-card">
          <h3 class="settings-card-title">店名・ロゴ</h3>
          <div class="form-group">
            <label for="s1-shop-name">店舗名（未入力の場合「SIS Web Reservation」のまま）</label>
            <input type="text" id="s1-shop-name" placeholder="例：Blanc 美容室ブラン">
          </div>
          <div class="form-group">
            <label for="s1-logo-url">ロゴ画像のURL（任意）</label>
            <input type="text" id="s1-logo-url" placeholder="https://example.com/logo.png">
          </div>
        </div>

        <div class="settings-card">
          <h3 class="settings-card-title">連絡先情報（ヘッダー右側に表示）</h3>
          <div class="form-group">
            <label for="s1-contact-phone">電話番号</label>
            <input type="text" id="s1-contact-phone" placeholder="0799-XX-XXXX">
          </div>
          <div class="form-group">
            <label for="s1-contact-hours">受付時間の表示文言</label>
            <input type="text" id="s1-contact-hours" placeholder="受付時間 9:00 - 18:00">
          </div>
          <div class="form-group">
            <label for="s1-contact-closed">定休日の表示文言</label>
            <input type="text" id="s1-contact-closed" placeholder="定休日：月曜日">
          </div>
        </div>

        <div class="settings-card">
          <h3 class="settings-card-title">営業時間</h3>
          <div id="business-hours-rows" class="business-hours-rows"></div>
        </div>

        <div class="settings-card">
          <h3 class="settings-card-title">メニュー・料金</h3>
          <div id="menu-master-rows" class="menu-master-rows"></div>
          <button type="button" id="add-menu-row-btn" class="btn-add-row">＋ メニューを追加</button>
        </div>

        <div class="settings-card">
          <h3 class="settings-card-title">スタッフ名</h3>
          <p class="settings-card-note">カレンダーIDは変更されません。名前だけを書き換えます。スタッフの追加・削除はできません。</p>
          <div id="staff-name-rows" class="staff-name-rows"></div>
        </div>

        <div class="settings-card">
          <h3 class="settings-card-title">その他</h3>
          <div class="form-group">
            <label for="s1-max-capacity">同時受付上限（同じ時間帯に、全体で何件まで受け付けるか）</label>
            <input type="number" id="s1-max-capacity" min="1">
          </div>
          <div class="form-group">
            <label for="s1-reminder-days">予約前日メールを送るタイミング（何日前に送るか。0で送信しない）</label>
            <input type="number" id="s1-reminder-days" min="0">
          </div>
        </div>

        <button type="submit" id="save-settings1-btn" class="btn-save-settings">保存する</button>
      </form>
    </section>

  </main>
</div>

<script src="./js/config.js?v=1.4.0"></script>
<script src="./js/admin.js?v=1.4.0"></script>

</body>
</html>
